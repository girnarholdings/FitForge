name: Deploy web demo to GitHub Pages

# Builds the Next.js web app as a static export (demo mode, no backend) and
# publishes it to GitHub Pages. The demo runs entirely client-side using the
# @fitforge/shared rules + fixtures and localStorage.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      # seed/ IS a deploy input, not just a database concern: the web app imports
      # seed/data/exercises.json directly (components/illustrations/poses/catalog.ts,
      # components/features/exercises/ExerciseDetail.tsx), and seed/import-usda.mjs is the
      # tier-2 food catalog builder run below. Without this a seed-only commit — e.g. the
      # 59→91 exercise expansion — silently never reaches Pages.
      - "seed/**"
      # A dependency change alters the bundle even when no app file moves.
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Kept in step with ci.yml's NODE_VERSION (22). Node 20 is end-of-life as of April 2026,
          # and this workflow is the one that actually ships the bundle users load — it must not
          # build on an older runtime than the one CI proved the bundle on.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared package
        run: npm run build -w @fitforge/shared

      # Tier-2 food catalog. Fetches USDA FoodData Central (public domain) and emits the lazy
      # shards under apps/web/public/food/. It runs HERE rather than being committed because the
      # artefact is ~40 MB and goes stale on every USDA release — and because this runner has
      # network access to fdc.nal.usda.gov that a sandboxed dev machine does not.
      #
      # continue-on-error is deliberate: if USDA is down or moves a dated filename, the deploy
      # should still ship with the curated 509-food tier-1 core rather than failing outright. The
      # app already treats a missing tier 2 as a normal state and says so in the UI.
      #
      # The importer's own diagnostics go to stdout/stderr, i.e. into the job log — which is served
      # from *.blob.core.windows.net and can be unreachable under a restricted egress policy. That
      # is how this step failed on every deploy since the catalog was added without anyone learning
      # WHY: the only visible trace was "Process completed with exit code 1". Echoing the tail of
      # the output as an ::error:: puts the actual reason (the failing URL and HTTP status) into a
      # check-run annotation, which is readable from api.github.com.
      - name: Build tier-2 food catalog (USDA FoodData Central)
        id: food
        continue-on-error: true
        run: |
          set -o pipefail
          if node seed/import-usda.mjs 2>&1 | tee /tmp/usda.log; then
            exit 0
          fi
          # Collapse to one line: annotations do not preserve newlines, and the useful part is the
          # last thing the importer said before it gave up.
          reason=$(tail -8 /tmp/usda.log | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-500)
          echo "::error::Tier-2 USDA import failed — ${reason}"
          exit 1

      # MUST run whatever the importer did. The importer stages its downloads INSIDE the output
      # directory (apps/web/public/food/.branded.zip and the unzipped .branded/ tree — see
      # fetchDataset in seed/import-usda.mjs), so a fetch that dies partway leaves multi-GB
      # scratch files sitting in public/. Next copies public/ into out/ verbatim, dotfiles
      # included, so with continue-on-error above those leftovers would be published to Pages as
      # part of the site. Nothing but the shards and the manifest may survive this step.
      #
      # A shard directory with no manifest.json is likewise deleted rather than shipped: the
      # manifest is written last, so its absence means the shard set is incomplete, and the app
      # keys tier-2 availability off the manifest alone (lib/food/tier2.ts) — orphan shards would
      # be dead weight in the artifact that nothing can ever read.
      - name: Prune tier-2 scratch files
        if: always()
        run: |
          rm -rf apps/web/public/food/.[!.]* || true
          if [ -d apps/web/public/food ] && [ ! -f apps/web/public/food/manifest.json ]; then
            echo "::warning::Tier-2 import left shards without a manifest; discarding the partial catalog"
            rm -rf apps/web/public/food
          fi

      # Reports the LARGEST SHARD alongside the total, because that is the number search latency
      # actually depends on: a shard is fetched and parsed whole the first time a query lands in
      # it, so the worst bucket sets the worst case and the average hides it. The importer caps
      # rows per shard, but the byte size of a capped shard still moves with the data, and this is
      # the only place it can be observed — the shards are a build artefact that never reaches a
      # dev machine, and the job log is served from a host a restricted egress policy may refuse.
      - name: Report tier-2 outcome
        run: |
          if [ -f apps/web/public/food/manifest.json ]; then
            stats=$(node -e '
              const fs = require("node:fs");
              const dir = "apps/web/public/food";
              const m = JSON.parse(fs.readFileSync(dir + "/manifest.json", "utf8"));
              let worst = { key: "-", bytes: 0, rows: 0 };
              let total = 0;
              for (const key of Object.keys(m.shards)) {
                const bytes = fs.statSync(`${dir}/${key}.json`).size;
                total += bytes;
                if (bytes > worst.bytes) worst = { key, bytes, rows: m.shards[key] };
              }
              const kb = (n) => (n / 1024).toFixed(0);
              const d = m.dropped || {};
              process.stdout.write(
                `${m.total} foods across ${Object.keys(m.shards).length} shards, ${kb(total)} kB total; ` +
                `largest ${worst.key}.json ${kb(worst.bytes)} kB (${worst.rows} rows); ` +
                `collapsed ${d.duplicates ?? "?"} duplicates, dropped ${d.over_cap ?? "?"} over the shard cap`
              );
            ')
            echo "::notice::Tier-2 food catalog built — ${stats}"
          else
            echo "::warning::Tier-2 food catalog unavailable; deploying with the 509-food curated core only"
          fi

      - name: Build web static export
        run: npm run build -w @fitforge/web
        env:
          # Project Pages serve from https://<owner>.github.io/<repo>/.
          #
          # The owner is girnarholdings, NOT the ZeusNightBolt in `git remote -v`. The repository
          # was TRANSFERRED: `GET /repos/ZeusNightBolt/FitForge` answers 301 Moved Permanently to
          # repository id 1305324070, whose full_name is girnarholdings/FitForge, and the Pages
          # API reports html_url https://girnarholdings.github.io/FitForge/. Git follows that
          # redirect silently on push, which is why the stale remote still works and why reading
          # the owner off `git remote -v` gets this exactly backwards.
          #
          # `metadataBase` in app/layout.tsx is built from this, so getting it wrong points every
          # OpenGraph and Twitter image at a host with no such file and breaks every link preview.
          # Verify with the API before changing it, never from the remote URL.
          NEXT_PUBLIC_BASE_PATH: /FitForge
          NEXT_PUBLIC_SITE_URL: https://girnarholdings.github.io
          NEXT_PUBLIC_DEMO: "1"

      - name: Add .nojekyll (serve _next/ assets)
        run: touch apps/web/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out
          # REQUIRED, and the site breaks silently without it. v4 added `include-hidden-files`
          # defaulting to FALSE, which passes `--exclude=.[^/]*` to the tar that builds the
          # artifact — so every dotfile is dropped, including the `.nojekyll` written by the step
          # above. No `.nojekyll` means Pages runs the upload through Jekyll, and Jekyll skips
          # directories beginning with an underscore: `_next/` disappears and every script and
          # stylesheet 404s. The deploy still reports success, so the first symptom would be a
          # blank site. v3 had no such exclusion; `true` keeps the behaviour this workflow had.
          include-hidden-files: true

      # PROOF, not assumption. Everything above is one action input away from serving a blank site,
      # and that failure is INVISIBLE: the tar is built without .nojekyll, the upload succeeds, the
      # deploy reports success, and only a browser hitting a 404 on every _next/ asset reveals it.
      # No job status catches that, so assert it directly against the artifact that was just built.
      #
      # upload-pages-artifact tars into $RUNNER_TEMP/artifact.tar with `--directory <path> ... .`,
      # so entries are './'-prefixed. Both spellings are accepted in case that ever changes.
      # Verified both ways locally: the same tar built with `--exclude=.[^/]*` (what this action
      # does when include-hidden-files is false) drops .nojekyll and trips this check.
      - name: Verify .nojekyll survived into the artifact
        run: |
          if ! tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qE '^\./\.nojekyll$|^\.nojekyll$'; then
            echo "::error::.nojekyll is missing from the Pages artifact — Jekyll will strip _next/ and every asset will 404"
            echo "Artifact contains:"
            tar -tf "$RUNNER_TEMP/artifact.tar" | head -30
            exit 1
          fi
          echo "::notice::.nojekyll present in the Pages artifact — _next/ will be served"

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

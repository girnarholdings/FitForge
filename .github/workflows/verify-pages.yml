# Verify the DEPLOYED Pages site actually serves what was just shipped.
#
# WHY THIS RUNS HERE AND NOT IN THE DEV SANDBOX. The development environment's egress proxy
# refuses CONNECT to github.io (403), exactly as it does for *.workers.dev — which is how a green
# deploy sat unverified for twenty minutes while a sandbox-side watcher silently failed every
# poll. Any check of the live site has to run from a network that can see the live site; for this
# repo that means a GitHub runner, the same answer the Coach worker probe already settled on.
#
# WHAT IT PROVES:
#   1. The site responds and the /today/ page is real HTML referencing hashed _next/ assets.
#   2. EVERY asset that HTML references resolves 200 — the half-propagated state where the CDN
#      serves fresh HTML pointing at chunks it has not got yet fails here, loudly.
#   3. (Optional) the served bundle CONTAINS given marker strings — pass `markers` on manual
#      dispatch to prove a specific change is live (e.g. a class name or copy string the change
#      introduced). The default marker is a token every build since the forge-identity pass
#      carries, so the standing check also catches a rollback to something ancient.
#
#      MARKERS ARE PER-PAGE. A route only pulls the chunks it needs, so a string that lives in the
#      onboarding welcome screen is genuinely absent from /today/'s bundle — checking for it there
#      reports a missing marker on a perfectly good deploy, which is exactly what happened the
#      first time this was used to verify a landing-page change. Pass `path` to point the whole
#      check at the page that should contain them.
#
# The HTML fetch is cache-busted per run; the hashed assets are immutable by name and need none.
name: Verify the deployed Pages site

on:
  workflow_dispatch:
    inputs:
      markers:
        description: 'Space-separated strings the served JS+CSS must contain'
        required: false
        default: 'ff-tab-spark'
      path:
        description: 'Page to fetch, e.g. / or /onboarding/welcome/ (default /today/). Markers are matched against THAT page and its chunks.'
        required: false
        default: '/today/'
  workflow_run:
    workflows: ['Deploy web demo to GitHub Pages']
    types: [completed]

permissions: {}

concurrency:
  group: verify-pages
  cancel-in-progress: true

jobs:
  verify:
    # On workflow_run, only bother when the deploy itself succeeded — a failed deploy already
    # reported its own failure and this would just repeat it with a worse error message.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the page under test and every asset it references
        env:
          # The CUSTOM DOMAIN, not github.io. The first real run of this workflow is why: the
          # site had grown a custom domain (repo Settings → Pages), github.io answered every URL
          # with a 301 stub, and a checker pointed at github.io "verified" a pile of redirect
          # bodies. The host under test must be the host users load.
          BASE: ${{ vars.PAGES_SITE_URL || 'https://goforge.fit' }}
          MARKERS: ${{ inputs.markers || 'ff-tab-spark' }}
          PAGE: ${{ inputs.path || '/today/' }}
        run: |
          set -u
          # The CDN can take a couple of minutes to propagate a fresh deploy; retry the whole
          # check rather than failing on the first stale read.
          for attempt in $(seq 1 12); do
            ok=1
            rm -rf /tmp/site && mkdir -p /tmp/site
            # -L on the PAGE ONLY: a canonical-host or trailing-slash redirect on the HTML is a
            # host's prerogative. Assets get NO -L below — an asset that redirects is exactly the
            # wrong-domain/wrong-base-path failure this workflow exists to catch.
            if ! curl -sSL --max-time 20 -D /tmp/site/headers.txt \
                 -w '%{http_code} %{url_effective}\n' \
                 "${BASE}${PAGE}?v=${GITHUB_RUN_ID}-${attempt}" -o /tmp/site/today.html \
                 > /tmp/site/status.txt 2>/tmp/site/curlerr.txt; then
              echo "attempt ${attempt}: ${PAGE} did not fetch — $(cat /tmp/site/curlerr.txt)"
              ok=0
            elif ! grep -q '^2' /tmp/site/status.txt; then
              echo "attempt ${attempt}: non-2xx: $(cat /tmp/site/status.txt)"
              sed -n '1,12p' /tmp/site/headers.txt
              ok=0
            else
              # Every hashed asset the page references (any base path), absolute-ised below
              # against the ORIGIN of $BASE — asset URLs in the HTML are root-relative.
              grep -o '/[A-Za-z0-9/._()%-]*_next/[A-Za-z0-9/._()%-]*\.\(js\|css\)' /tmp/site/today.html \
                | sort -u > /tmp/site/assets.txt
              count=$(wc -l < /tmp/site/assets.txt)
              origin=$(printf '%s' "$BASE" | sed -E 's#^(https?://[^/]+).*#\1#')
              if [ "$count" -lt 3 ]; then
                echo "attempt ${attempt}: page references only ${count} assets — not a real build"
                echo "  final url+status: $(cat /tmp/site/status.txt)"
                echo "  body head: $(head -c 300 /tmp/site/today.html | tr '\n' ' ')"
                ok=0
              else
                : > /tmp/site/bundle.txt
                while read -r path; do
                  code=$(curl -sS --max-time 20 -o /tmp/site/asset.bin -w '%{http_code}' \
                         "${origin}${path}" || echo 000)
                  if [ "$code" != "200" ]; then
                    # A redirect here means the HTML's asset paths do not exist on this host —
                    # the built base path and the serving domain disagree. Say so precisely.
                    echo "attempt ${attempt}: asset ${code} (want 200): ${origin}${path}"
                    ok=0
                    break
                  fi
                  cat /tmp/site/asset.bin >> /tmp/site/bundle.txt
                done < /tmp/site/assets.txt
              fi
            fi
            if [ "$ok" = 1 ]; then
              missing=""
              for m in $MARKERS; do
                grep -qF "$m" /tmp/site/bundle.txt /tmp/site/today.html || missing="$missing $m"
              done
              if [ -z "$missing" ]; then
                echo "::notice::Pages site verified at ${BASE}${PAGE}: $(wc -l < /tmp/site/assets.txt) assets all 200, markers present:${MARKERS:+ }$MARKERS"
                exit 0
              fi
              echo "attempt ${attempt}: markers not yet in the served bundle:${missing}"
              echo "  final url+status: $(cat /tmp/site/status.txt)"
              grep -i '^last-modified\|^x-github-request' /tmp/site/headers.txt || true
            fi
            sleep 15
          done
          echo "::error::The deployed site never verified at ${BASE}${PAGE}: assets missing or markers absent after 12 attempts (~3 min). See the per-attempt lines above for the served status, URL and body."
          exit 1

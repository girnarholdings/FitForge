name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 22, not 20: Node 20 went end-of-life in April 2026, so it stopped receiving security patches
  # while still being the version every job here built and tested with. 22 is the LTS line the
  # suite is actually developed against — matching them means a green CI run and a green local run
  # are evidence about the same runtime, which is the whole point of running the suite twice.
  # Node 22 also ships npm 10, matching the `packageManager: npm@10.8.2` pin in package.json;
  # Node 24 ships npm 11 and would quietly diverge from it.
  NODE_VERSION: "22"

jobs:
  # Shared TypeScript package (@fitforge/shared): rule mirrors, zod, RPC types.
  shared:
    name: shared · build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run build -w @fitforge/shared
      - run: npm run test -w @fitforge/shared

  # Web app (@fitforge/web): typecheck + static-export build (demo mode).
  web:
    name: web · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build shared dependency
        run: npm run build -w @fitforge/shared
      - name: Typecheck
        run: npm run typecheck -w @fitforge/web

      # Unit tests for the app's PURE logic. Everything in apps/web was covered only by Playwright
      # until now, which exercises it through a browser — fine for behaviour, useless for the cases
      # that matter in a parser: a record split across a stream chunk, a near-midnight timestamp, two
      # devices reporting the same steps. None of those are reachable by clicking.
      - name: Unit tests
        run: npm run test:unit -w @fitforge/web

      # Same cache as the e2e job, same key — so whichever job finishes its build first populates
      # it and the other reuses it on the next run.
      - name: Cache the Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx', 'apps/web/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build (static export)
        run: npm run build -w @fitforge/web
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_DEMO: "1"

  # Seed content (@fitforge/seed): validation gate + validator unit tests.
  seed:
    name: seed · check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate seed data
        run: npm run seed:check -w @fitforge/seed
      - name: Validator unit tests
        run: npm run test -w @fitforge/seed

      # The tier-2 importer is only ever RUN in the Pages workflow, where it is
      # continue-on-error — so a regression in it (a bad rejection rule, a broken shard key, a
      # syntax error) would not fail anything: the deploy would just quietly ship tier-1 only and
      # nobody would learn the importer is broken. This runs the same code path offline against
      # seed/fixtures/fdc-sample.json, which deliberately carries BOTH FDC nutrient shapes, and
      # then asserts the manifest it wrote actually describes the shards it wrote.
      - name: Tier-2 importer smoke test (offline fixture)
        run: |
          npm run food:import:fixture -w @fitforge/seed
          node -e '
            const fs = require("node:fs");
            const dir = "apps/web/public/food";
            const manifest = JSON.parse(fs.readFileSync(dir + "/manifest.json", "utf8"));
            if (!(manifest.total > 0)) throw new Error("importer wrote an empty catalog");
            for (const [key, count] of Object.entries(manifest.shards)) {
              const shard = JSON.parse(fs.readFileSync(`${dir}/${key}.json`, "utf8"));
              if (shard.foods.length !== count) {
                throw new Error(`shard ${key}: manifest says ${count}, file has ${shard.foods.length}`);
              }
              for (const food of shard.foods) {
                // The whole point of the importer: no invented numbers reach the catalog.
                if (typeof food.per_100g?.kcal !== "number") throw new Error(`${food.id}: no kcal`);
              }
            }
            console.log(`importer OK — ${manifest.total} foods, ${Object.keys(manifest.shards).length} shards`);
          '
      - name: Clean importer output
        if: always()
        run: rm -rf apps/web/public/food

  # Optional Coach worker (workers/coach). Not a workspace of the root package.json — it deploys
  # on its own from its own directory — so it needs its own install step here.
  #
  # WHY IT IS TESTED AT ALL, given the app works without it: the browser calls this worker
  # DIRECTLY, with no server in between to sanitise a bad request or clamp a runaway response. The
  # origin allow-list and the token caps are the only thing between a published URL and someone
  # else's Workers AI bill, and neither is exercised by any other job.
  worker:
    name: worker · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This job had NO dependency cache at all — not even the tarball cache the others got — so it
      # re-downloaded wrangler and its tree from the registry on every single run.
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: workers/coach
      # `npm run typecheck`, NOT `npx tsc` with inline flags. This job installs only
      # workers/coach, which has no root node_modules to fall back on, so the original `npx tsc`
      # silently downloaded an unpinned TypeScript from the registry at build time — it resolved on
      # a dev machine purely because the monorepo root had one hoisted. TypeScript is now a
      # dependency of this package with its own tsconfig.json, so the compiler and its settings are
      # the same everywhere.
      - name: Typecheck
        working-directory: workers/coach
        run: npm run typecheck
      - name: Test the worker contract
        working-directory: workers/coach
        run: npm test

  # Web app end-to-end (@fitforge/web): the Playwright suite against the real static export.
  #
  # WHY THIS JOB EXISTS: typecheck + build only prove the bundle compiles. Every behaviour that
  # actually defines this product — onboarding completing, a workout persisting to localStorage,
  # the generator not producing an empty day — is client-side and invisible to tsc. Without this
  # job a change can be green in CI and broken the moment Pages serves it.
  e2e:
    name: web · e2e (playwright)
    runs-on: ubuntu-latest
    # Was 30. The suite itself measures ~2 min now (see playwright.config.ts for the worker-count
    # audit and tests/e2e/onboarded.setup.ts for the onboarding snapshot); 15 leaves generous room
    # for a cold cache and still catches a hang in minutes instead of half an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build shared dependency
        run: npm run build -w @fitforge/shared

      # ── Chromium, cached ────────────────────────────────────────────────────────────────────
      #
      # This step used to re-download the browser on EVERY run: several hundred megabytes, every
      # push, every PR, to get a binary byte-identical to the last one.
      #
      # The key is the exact @playwright/test version and nothing else, because that is precisely
      # the constraint Playwright enforces: each release pins a browser BUILD NUMBER and refuses
      # anything else, with "Executable doesn't exist at .../chromium_headless_shell-<build>". A
      # looser key would restore a browser the installed Playwright will not launch — and no
      # restore-keys, for the same reason: a near-miss here is not a partial win, it is a browser
      # that cannot start.
      #
      # Only Chromium: the suite pins the iPhone 13 device profile on a Chromium engine
      # (playwright.config.ts), so the other browsers would be downloaded and never launched.
      - name: Resolve the pinned Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The binary is cached; the system libraries it links against are not, because they are apt
      # packages on a fresh runner. `install-deps` is the apt half alone and skips the download.
      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::Browser restored from cache — installing system libraries only"
            npx playwright install-deps chromium
          else
            echo "::notice::Browser cache miss — downloading Chromium"
            npx playwright install --with-deps chromium
          fi

      # Tier-2 shards, from the OFFLINE FIXTURE. Without a catalog present the tier2-cache specs
      # skip themselves — correctly, since a missing tier 2 is a supported deployment state — but
      # that means the persistent shard cache would never actually be exercised anywhere. Building
      # the fixture catalog here costs a second and turns those four specs from skipped to real.
      - name: Build tier-2 fixture catalog (for the cache specs)
        run: npm run food:import:fixture -w @fitforge/seed

      - name: Cache the Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx', 'apps/web/**/*.css') }}
          # RESTORE-KEYS ARE CORRECT HERE, and wrong for node_modules and the browser above. The
          # difference is what a near-miss costs. A stale .next/cache is a pile of hints that Next
          # validates entry by entry and discards when they no longer apply — worst case it rebuilds
          # what it would have rebuilt anyway. A stale node_modules would be silently tested
          # against; a stale browser would not launch. Same mechanism, opposite correct answer.
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      # The suite serves apps/web/out — it does not build it. Base path MUST be empty here: the
      # test server mounts out/ at the root, so a /FitForge prefix would 404 every asset.
      #
      # THE FIREBASE CONFIG IS INCLUDED so the E2E suite exercises the build that actually ships.
      # Without it CI would only ever see the Local-Mode-only variant, and the account card, the
      # sign-in buttons and the members-only model filter — all real UI on the live site — would be
      # covered by nobody. No network is involved for a signed-out visitor: the SDK resolves "no
      # user" from local persistence, which is the state every spec runs in.
      - name: Build static export
        run: npm run build -w @fitforge/web
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_DEMO: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || 'AIzaSyCnTHrW2_sHXkkpzKASKD9ud-vxXsSrNLE' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || 'fitforge-007.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'fitforge-007' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || 'fitforge-007.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || '8172039135' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || '1:8172039135:web:27cb97aa54b0cde59e326a' }}

      # Worker count lives in playwright.config.ts, not here, so a local run and a CI run are the
      # same run. It used to be pinned to 1 from this line on the belief that the specs raced; they
      # do not, and the config records what was actually checked.
      - name: Run E2E suite
        run: npm run test:e2e -w @fitforge/web

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-output
          path: apps/web/tests/.output
          retention-days: 7
          if-no-files-found: ignore

  # NOTE: the database (Supabase local stack + pgTAP) and iOS (macOS + xcodebuild)
  # jobs are deferred until those layers are wired to a live stack / verified on a
  # Mac. Their sources live under supabase/ and apps/ios/. Re-add dedicated
  # workflows once verified end-to-end.

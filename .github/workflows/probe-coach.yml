name: Probe the Coach worker

# Calls the DEPLOYED worker and reports exactly what it says.
#
# WHY THIS EXISTS AS A WORKFLOW. The development sandbox cannot reach *.workers.dev — its egress
# policy refuses the CONNECT — so "is the worker actually answering?" was unanswerable from the
# machine doing the work. A GitHub runner has open network and its annotations are readable from
# api.github.com, which makes it the one available probe.
#
# Run it from the Actions tab (Run workflow), or on any push that touches the worker.

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Question to send'
        required: false
        default: 'How many sets per muscle per week?'
  push:
    branches: [main]
    paths:
      - 'workers/coach/**'
      - '.github/workflows/probe-coach.yml'

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - name: Check the endpoint is configured
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          if [ -z "$ENDPOINT" ]; then
            echo "::error::AI_ENDPOINT repository variable is not set — nothing to probe"
            exit 1
          fi
          echo "::notice::Probing ${ENDPOINT}"

      # GET is the health check: it needs no Origin and no body, so it separates "the worker is
      # deployed and running" from "the AI binding works". If this fails, nothing downstream matters.
      - name: GET health check
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          body=$(curl -sS -m 30 -w '\n%{http_code}' "$ENDPOINT" || echo "CURL_FAILED")
          code=$(printf '%s' "$body" | tail -1)
          payload=$(printf '%s' "$body" | sed '$d' | tr '\n' ' ' | cut -c1-400)
          echo "::notice::GET ${code} — ${payload}"
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed with ${code}. The worker is not serving."
            exit 1
          fi

      # POST is the real path the browser takes, Origin header included. Its failure modes are
      # distinct and each points at a different fix, so the status code is reported verbatim rather
      # than collapsed into "it didn't work".
      #
      # A REFERENCE SNIPPET IS ATTACHED ON PURPOSE. The app always sends the retrieved knowledge-base
      # entries with the question — grounding is the whole design, since a small model answering from
      # memory invents numbers. This probe originally sent `snippets: []` and the worker duly came
      # back with "3-4 sets per muscle per week", which is badly wrong (the landmark is 10-20 hard
      # sets) and passed the probe anyway. A green run has to mean the path the app takes works, so
      # the probe now sends what the app sends, and asserts the model actually used it.
      - name: POST a real question
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
          QUESTION: ${{ inputs.question || 'How many sets per muscle per week?' }}
        run: |
          body=$(curl -sS -m 45 -w '\n%{http_code}' -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://girnarholdings.github.io' \
            -d "$(jq -nc --arg q "$QUESTION" '{
                  question: $q,
                  snippets: [{
                    question: "How much weekly volume per muscle?",
                    answer: "10-20 hard sets per muscle per week is the productive range for most lifters."
                  }]
                }')" || echo "CURL_FAILED")
          code=$(printf '%s' "$body" | tail -1)
          payload=$(printf '%s' "$body" | sed '$d' | tr '\n' ' ' | cut -c1-700)

          case "$code" in
            200) echo "::notice::POST 200 — ${payload}" ;;
            403) echo "::error::POST 403 — the Origin is not in ALLOWED_ORIGINS. Body: ${payload}" ;;
            500) echo "::error::POST 500 — no backend configured (binding must be named exactly AI), or a rejected MISTRAL_API_KEY. Body: ${payload}" ;;
            503) echo "::error::POST 503 — the worker reached the model provider and it refused. The detail lists every model tried; '5028 deprecated' means Cloudflare retired them. Body: ${payload}" ;;
            *)   echo "::error::POST ${code} — ${payload}" ;;
          esac
          [ "$code" = "200" ] || exit 1

          # Grounding is not decoration. If the reference notes reach the model and are ignored, the
          # worker returns 200 with a confidently wrong number — which is worse than a 503, because
          # a 503 falls back to the curated guide and this does not.
          answer=$(printf '%s' "$body" | sed '$d' | jq -r '.answer // ""')
          if printf '%s' "$answer" | grep -qiE '\b(10|12|15|20)[ -]*(to|-|–)?[ -]*(20|sets)|10-20'; then
            echo "::notice::The answer used the supplied reference notes"
          else
            echo "::error::POST 200 but the answer IGNORED the reference notes. The supplied note said 10-20 hard sets per muscle per week; the model replied: ${answer}"
            exit 1
          fi

      # The macros task: three model samples, sanity-gated, median + range. The assertion is the
      # CONTRACT (parses, has a kcal median inside its own range), not the food's true calories —
      # a probe cannot know what a model should think a burrito weighs.
      - name: POST a macros estimate
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          body=$(curl -sS -m 60 -w '\n%{http_code}' -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://girnarholdings.github.io' \
            -d '{"task":"macros","food":"chicken burrito bowl with rice and beans"}' || echo "CURL_FAILED")
          code=$(printf '%s' "$body" | tail -1)
          payload=$(printf '%s' "$body" | sed '$d')
          echo "::notice::macros ${code} — $(printf '%s' "$payload" | tr '\n' ' ' | cut -c1-500)"
          [ "$code" = "200" ] || { echo "::error::macros task failed with ${code}"; exit 1; }
          printf '%s' "$payload" | jq -e '
            (.kcal.value >= .kcal.low) and (.kcal.value <= .kcal.high)
            and (.kcal.value > 100) and (.kcal.value < 2500)
            and (.samples >= 2)
            and (.confidence | IN("high","medium","low"))
          ' > /dev/null || { echo "::error::macros response failed the contract check"; exit 1; }

      # Only reached when the above passed, so a green run means the whole chain works.
      - name: Report success
        run: echo "::notice::Coach worker is answering end to end"

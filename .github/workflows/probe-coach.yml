name: Probe the Coach worker

# Calls the DEPLOYED worker and reports exactly what it says.
#
# WHY THIS EXISTS AS A WORKFLOW. The development sandbox cannot reach *.workers.dev — its egress
# policy refuses the CONNECT — so "is the worker actually answering?" was unanswerable from the
# machine doing the work. A GitHub runner has open network and its annotations are readable from
# api.github.com, which makes it the one available probe.
#
# Run it from the Actions tab (Run workflow), or on any push that touches the worker.

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Question to send'
        required: false
        default: 'How many sets per muscle per week?'
  push:
    branches: [main]
    paths:
      - 'workers/coach/**'
      - '.github/workflows/probe-coach.yml'

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - name: Check the endpoint is configured
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          if [ -z "$ENDPOINT" ]; then
            echo "::error::AI_ENDPOINT repository variable is not set — nothing to probe"
            exit 1
          fi
          echo "::notice::Probing ${ENDPOINT}"

      # GET is the health check: it needs no Origin and no body, so it separates "the worker is
      # deployed and running" from "the AI binding works". If this fails, nothing downstream matters.
      - name: GET health check
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          body=$(curl -sS -m 30 -w '\n%{http_code}' "$ENDPOINT" || echo "CURL_FAILED")
          code=$(printf '%s' "$body" | tail -1)
          payload=$(printf '%s' "$body" | sed '$d')
          echo "::notice::GET ${code} — $(printf '%s' "$payload" | tr '\n' ' ' | cut -c1-900)"
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed with ${code}. The worker is not serving."
            exit 1
          fi
          # Which backend is actually serving, and what the app's model picker will offer. Both
          # printed as their own lines rather than left inside a truncated JSON blob: this is the
          # question every "did my key land?" check is really asking, and it deserves a sentence.
          provider=$(printf '%s' "$payload" | jq -r '.provider // "unknown"')
          models=$(printf '%s' "$payload" | jq -r '(.models // []) | length')
          catalog=$(printf '%s' "$payload" | jq -r '(.models // []) | map("\(.label) [\(.provider)]") | join(", ")')
          if [ "$models" = "0" ]; then
            echo "::warning::This worker advertises no model catalog — the app's model picker will not appear. Deploy the current workers/coach (npx wrangler deploy)."
          else
            echo "::notice::Model picker will offer ${models}: ${catalog}"
          fi
          # Workers AI alone is a legitimate config, so a missing key is a WARNING, not a failure —
          # but a green run that silently used the fallback is exactly how "I added the Mistral key"
          # and "the worker never saw it" coexist for weeks.
          if [ "$provider" = "mistral" ]; then
            echo "::notice::Primary backend: Mistral — the MISTRAL_API_KEY secret is live on this worker"
          else
            echo "::warning::Primary backend: ${provider} — MISTRAL_API_KEY is NOT visible to this worker. 'wrangler deploy' does NOT carry secrets: set it explicitly with 'cd workers/coach && npx wrangler secret put MISTRAL_API_KEY', and confirm with 'npx wrangler secret list' (which prints the names actually bound to the deployed worker). A dashboard entry that was saved-but-not-deployed, added to a preview environment, or stored in the account-level Secrets Store without a binding will all look set while being invisible here."
          fi

      # POST is the real path the browser takes, Origin header included. Its failure modes are
      # distinct and each points at a different fix, so the status code is reported verbatim rather
      # than collapsed into "it didn't work".
      #
      # A REFERENCE SNIPPET IS ATTACHED ON PURPOSE. The app always sends the retrieved knowledge-base
      # entries with the question — grounding is the whole design, since a small model answering from
      # memory invents numbers. This probe originally sent `snippets: []` and the worker duly came
      # back with "3-4 sets per muscle per week", which is badly wrong (the landmark is 10-20 hard
      # sets) and passed the probe anyway. A green run has to mean the path the app takes works, so
      # the probe now sends what the app sends, and asserts the model actually used it.
      # The Origin header stays github.io ON PURPOSE: it is in the DEPLOYED worker's allow-list
      # today, and switching it to goforge.fit before the worker is redeployed with the new
      # ALLOWED_ORIGINS would make every probe 403 for a reason that has nothing to do with the
      # worker's health. Once a redeploy ships the new list (which allows both), this can move to
      # the custom domain.
      - name: POST a real question
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
          QUESTION: ${{ inputs.question || 'How many sets per muscle per week?' }}
        run: |
          body=$(curl -sS -m 45 -w '\n%{http_code}' -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://girnarholdings.github.io' \
            -d "$(jq -nc --arg q "$QUESTION" '{
                  question: $q,
                  snippets: [{
                    question: "How much weekly volume per muscle?",
                    answer: "10-20 hard sets per muscle per week is the productive range for most lifters."
                  }]
                }')" || echo "CURL_FAILED")
          code=$(printf '%s' "$body" | tail -1)
          payload=$(printf '%s' "$body" | sed '$d' | tr '\n' ' ' | cut -c1-700)

          case "$code" in
            200) echo "::notice::POST 200 — ${payload}" ;;
            403) echo "::error::POST 403 — the Origin is not in ALLOWED_ORIGINS. Body: ${payload}" ;;
            500) echo "::error::POST 500 — no backend configured (binding must be named exactly AI), or a rejected MISTRAL_API_KEY. Body: ${payload}" ;;
            503) echo "::error::POST 503 — the worker reached the model provider and it refused. The detail lists every model tried; '5028 deprecated' means Cloudflare retired them. Body: ${payload}" ;;
            *)   echo "::error::POST ${code} — ${payload}" ;;
          esac
          [ "$code" = "200" ] || exit 1

          # Grounding is not decoration. If the reference notes reach the model and are ignored, the
          # worker returns 200 with a confidently wrong number — which is worse than a 503, because
          # a 503 falls back to the curated guide and this does not.
          answer=$(printf '%s' "$body" | sed '$d' | jq -r '.answer // ""')
          if printf '%s' "$answer" | grep -qiE '\b(10|12|15|20)[ -]*(to|-|–)?[ -]*(20|sets)|10-20'; then
            echo "::notice::The answer used the supplied reference notes"
          else
            echo "::error::POST 200 but the answer IGNORED the reference notes. The supplied note said 10-20 hard sets per muscle per week; the model replied: ${answer}"
            exit 1
          fi

      # The macros task: three model samples, sanity-gated, median + range. The assertion is the
      # CONTRACT (parses, has a kcal median inside its own range), not the food's true calories —
      # a probe cannot know what a model should think a burrito weighs.
      - name: POST a macros estimate
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          body=$(curl -sS -m 60 -w '\n%{http_code}' -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://girnarholdings.github.io' \
            -d '{"task":"macros","food":"chicken burrito bowl with rice and beans"}' || echo "CURL_FAILED")
          code=$(printf '%s' "$body" | tail -1)
          payload=$(printf '%s' "$body" | sed '$d')
          echo "::notice::macros ${code} — $(printf '%s' "$payload" | tr '\n' ' ' | cut -c1-500)"
          [ "$code" = "200" ] || { echo "::error::macros task failed with ${code}"; exit 1; }
          printf '%s' "$payload" | jq -e '
            (.kcal.value >= .kcal.low) and (.kcal.value <= .kcal.high)
            and (.kcal.value > 100) and (.kcal.value < 2500)
            and (.samples >= 2)
            and (.confidence | IN("high","medium","low"))
          ' > /dev/null || { echo "::error::macros response failed the contract check"; exit 1; }

      # The meal task: one splitter call, then the consensus estimator per item. The probe sends
      # the sentence from the owner's bug report, and the assertion is the CONTRACT (items parse,
      # every priced item's kcal median sits inside its own range) plus the reason the task
      # exists: the eggs must come back with a preparation, not the catalog's raw/boiled default.
      # A worker that predates the task gets a redeploy reminder, not a failure.
      - name: POST a meal parse
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          health=$(curl -sS -m 20 "$ENDPOINT")
          if ! printf '%s' "$health" | jq -e '(.tasks // []) | index("meal")' > /dev/null; then
            echo "::warning::This worker predates the meal task — AI-first nutrition entry falls back to the offline catalog until 'cd workers/coach && npx wrangler deploy' ships it."
            exit 0
          fi
          body=$(curl -sS -m 90 -w '\n%{http_code}' -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://girnarholdings.github.io' \
            -d '{"task":"meal","text":"steak and eggs"}' || echo "CURL_FAILED")
          code=$(printf '%s' "$body" | tail -1)
          payload=$(printf '%s' "$body" | sed '$d')
          echo "::notice::meal ${code} — $(printf '%s' "$payload" | tr '\n' ' ' | cut -c1-700)"
          [ "$code" = "200" ] || { echo "::error::meal task failed with ${code}"; exit 1; }
          printf '%s' "$payload" | jq -e '
            (.items | length >= 1)
            and ([.items[] | select(has("error") | not)] | length >= 1)
            and ([.items[] | select(has("error") | not)] | all(
              (.kcal.value >= .kcal.low) and (.kcal.value <= .kcal.high) and (.kcal.value > 20)
            ))
          ' > /dev/null || { echo "::error::meal response failed the contract check"; exit 1; }
          eggs=$(printf '%s' "$payload" | jq -r '[.items[].food | select(test("egg"; "i"))] | first // ""')
          if [ -n "$eggs" ] && printf '%s' "$eggs" | grep -qiE 'raw|boiled'; then
            echo "::warning::The eggs came back as \"${eggs}\" — the preparation rule is not biting; the split prompt may need strengthening."
          elif [ -n "$eggs" ]; then
            echo "::notice::Preparation rule holds — the eggs parsed as \"${eggs}\""
          fi

      # The custom domain's CORS standing — a WARNING, not a failure, because it measures the
      # deploy-state transition (has `wrangler deploy` shipped the new ALLOWED_ORIGINS yet?)
      # rather than the worker's health. The check is the preflight the browser would send from
      # goforge.fit: an echo of the Origin in Access-Control-Allow-Origin means the site's Coach
      # calls will be accepted; anything else means the deployed worker predates the list.
      - name: Check the goforge.fit origin is allowed
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          acao=$(curl -sS -m 20 -X OPTIONS "$ENDPOINT" \
            -H 'Origin: https://goforge.fit' \
            -H 'Access-Control-Request-Method: POST' \
            -D - -o /dev/null | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2)
          if [ "$acao" = "https://goforge.fit" ]; then
            echo "::notice::CORS ok — the deployed worker allows https://goforge.fit"
          else
            echo "::warning::The deployed worker does NOT yet allow https://goforge.fit (got ACAO: ${acao:-none}). Coach calls from the live site will be refused until 'cd workers/coach && npx wrangler deploy' ships the updated ALLOWED_ORIGINS."
          fi

      # THE COMPANY-KEY GATE, checked against the live worker.
      #
      # The picker hides the members-only model from signed-out visitors, but hiding is not a
      # boundary — anyone can post the model id with curl. This asks the deployed worker to serve
      # that model with NO token and asserts it refuses, which is the property that keeps
      # anonymous traffic from spending FitForge's allowance and degrading signed-in users.
      #
      # Skipped, not failed, while the gate is dormant: with no FIREBASE_PROJECT_ID nobody can
      # sign in, so Mistral correctly serves everyone (a lock with no key cut for it would just
      # strand the paid model). The health check says which mode is live.
      - name: The members-only model is not reachable without a token
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          health=$(curl -sS -m 20 "$ENDPOINT")
          auth=$(printf '%s' "$health" | jq -r '.auth // "none"')
          gated=$(printf '%s' "$health" | jq -r '[.models // [] | .[] | select(.requiresAuth)] | length')
          if [ "$auth" != "firebase" ] || [ "$gated" = "0" ]; then
            echo "::notice::Members-only gate is dormant (auth=${auth}, gated models=${gated}) — Mistral serves everyone, which is correct until Firebase is configured."
            exit 0
          fi
          id=$(printf '%s' "$health" | jq -r '[.models[] | select(.requiresAuth)][0].id')
          got=$(curl -sS -m 45 -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://goforge.fit' \
            -d "$(jq -nc --arg m "$id" '{question:"how many sets per muscle per week?",model:$m,snippets:[{question:"Weekly volume",answer:"10-20 hard sets per muscle per week."}]}')" \
            | jq -r '.provider // "none"')
          if [ "$got" = "mistral" ]; then
            echo "::error::AN ANONYMOUS REQUEST REACHED THE COMPANY KEY. Asking for ${id} with no ID token was served by Mistral; it must fall back to workers-ai. The gate in workers/coach is not holding."
            exit 1
          fi
          echo "::notice::Gate holds — an anonymous request for ${id} was served by ${got}"

      # THE PRO TIER, reported rather than assumed.
      #
      # Two things must be true for a subscriber to actually get DeepSeek, and the picker's existence
      # only proves the first:
      #
      #   1. DEEPSEEK_API_KEY is visible to the deployed worker — the catalog carries a `deepseek`
      #      entry only when the key is non-empty AND sign-ins can be verified.
      #   2. PRO_USERS reached the worker with at least one uid on it. This is the one that fails
      #      quietly: it is a plain var in wrangler.toml, so a deploy from a stale checkout — or a
      #      value only ever typed into the Cloudflare dashboard — leaves an advertised Pro model
      #      nobody can unlock, and the symptom is a paying user silently served Mistral.
      #
      # Counts only; the worker deliberately does not publish who is entitled. A worker predating the
      # `pro` field reports nothing, which is a warning rather than a failure.
      - name: The Pro tier is wired end to end
        env:
          ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          health=$(curl -sS -m 20 "$ENDPOINT")
          deepseek=$(printf '%s' "$health" | jq -r '[.models // [] | .[] | select(.provider == "deepseek")] | length')
          allowlist=$(printf '%s' "$health" | jq -r '.pro.allowlist // "absent"')

          if [ "$deepseek" = "0" ]; then
            echo "::warning::No DeepSeek model in the catalog — DEEPSEEK_API_KEY is not visible to this worker (or FIREBASE_PROJECT_ID is unset, which makes a pro gate unusable). Set it with 'cd workers/coach && npx wrangler secret put DEEPSEEK_API_KEY'; 'wrangler deploy' does NOT carry secrets."
          else
            echo "::notice::DEEPSEEK_API_KEY is live on this worker — the Pro model is in the catalog"
          fi

          case "$allowlist" in
            absent)
              echo "::warning::This worker predates the pro read-out, so the PRO_USERS allowlist cannot be checked from outside. Redeploy the current workers/coach ('npx wrangler deploy') and re-run this probe." ;;
            0)
              if [ "$deepseek" != "0" ]; then
                echo "::error::The Pro model is advertised but PRO_USERS is EMPTY on the deployed worker — nobody can unlock it, and a subscriber tapping it is served Mistral instead. PRO_USERS is a var in workers/coach/wrangler.toml: deploy from a checkout that has it, or set it as a secret ('npx wrangler secret put PRO_USERS')."
                exit 1
              fi
              echo "::notice::No Pro tier on this worker (no DeepSeek key, empty allowlist) — a valid configuration." ;;
            *)
              echo "::notice::PRO_USERS reached the worker — ${allowlist} uid(s) entitled to the Pro model" ;;
          esac

      # Only reached when the above passed, so a green run means the whole chain works.
      - name: Report success
        run: echo "::notice::Coach worker is answering end to end"

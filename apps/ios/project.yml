# XcodeGen spec — the reviewable project source (docs/IOS-SHELL-CONTRACT.md, "Project + CI").
# Generate with:  cd apps/ios && xcodegen generate
# The .xcodeproj is never committed. Info.plist and the entitlements file are GENERATED from
# the `info:` / `entitlements:` blocks below at generate time (both are gitignored).

name: FitForge

options:
  bundleIdPrefix: com.fitforge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your Apple team id locally; CI builds unsigned
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  FitForge:
    type: application
    platform: iOS
    sources:
      - path: FitForge/App
      - path: FitForge/Bridge
      - path: FitForge/Storage
      - path: FitForge/Health
      - path: FitForge/Views
    settings:
      base:
        # Placeholder bundle id — change to YOUR identifier before device/App Store builds
        # (README, "Before you build").
        PRODUCT_BUNDLE_IDENTIFIER: com.fitforge.app
        TARGETED_DEVICE_FAMILY: "1" # iPhone; the web app is thumb-first
        SUPPORTS_MACCATALYST: NO
    info:
      path: FitForge/Info.plist
      properties:
        CFBundleDisplayName: FitForge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # ORIGIN IS FOREVER (contract law 1): app-bound domains lock navigation to the
        # product origin so localStorage identity can never fork.
        WKAppBoundDomains:
          - goforge.fit
        # Per-purpose wording, read-only (contract, "App Review posture").
        NSHealthShareUsageDescription: >-
          FitForge reads sleep to set your morning readiness, resting heart rate and
          heart-rate variability to gauge recovery against your own baseline, body weight
          to draw your trends, and steps, active energy, and workouts for weekly training
          context. Health data stays on this device and is never uploaded.
    entitlements:
      path: FitForge/FitForge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

  FitForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitForge/Tests
      # The frozen bridge fixtures, straight from the repo root — the SAME files the web
      # unit tests round-trip, copied into the test bundle so DecodingTests can load them.
      - path: ../../fixtures/forgebridge
        includes:
          - "*.json"
        buildPhase: resources
    dependencies:
      - target: FitForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitforge.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FitForge:
    build:
      targets:
        FitForge: all
        FitForgeTests: [test]
    run:
      config: Debug
    test:
      targets:
        - FitForgeTests
      gatherCoverageData: true
    archive:
      config: Release

# FitForge Coach — Cloudflare Worker (Workers AI)
#
# Deploy:
#   cd workers/coach
#   npx wrangler login
#   npx wrangler deploy
#
# Then point the web app at the deployed URL by setting, at build time:
#   NEXT_PUBLIC_AI_ENDPOINT=https://fitforge-coach.<your-subdomain>.workers.dev
#
# The app works WITHOUT this worker: the knowledge base answers locally. The worker only
# handles personalized/edge-case questions the KB can't confidently match.

name = "fitforge-coach"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Workers AI binding — no API key needed in code; billing/quota is per Cloudflare account.
[ai]
binding = "AI"

[vars]
# Comma-separated list of origins allowed to call this worker (CORS allow-list).
# Include your Pages origin. "*" is accepted for local testing but not recommended.
#
# goforge.fit is the custom domain the Pages site serves from; the http:// form matters until
# "Enforce HTTPS" is switched on for the domain (a page loaded over http sends Origin
# http://goforge.fit). github.io stays allowed for the transition — it now only 301-redirects to
# the domain, and the probe workflow still posts with that Origin.
#
# NOTE: this value reaches the LIVE worker only on deploy — after changing it, run
#   cd workers/coach && npx wrangler deploy
ALLOWED_ORIGINS = "https://goforge.fit,http://goforge.fit,https://girnarholdings.github.io,http://localhost:3000,http://localhost:4599"
# MODEL is deliberately NOT set.
#
# It used to be pinned to "@cf/meta/llama-3.1-8b-instruct". Cloudflare retired that model on
# 2026-05-30 and every request returned "AiError: 5028: This model was deprecated" from that day on —
# nothing in this project changed, the model was withdrawn underneath it. Pinning a replacement here
# would just restart the same clock, so the worker now carries a fallback chain (see
# WORKERS_AI_MODELS in src/index.ts) and skips retired candidates automatically.
#
# Set MODEL only to force a specific model. It is tried FIRST and the chain still backs it up, so a
# stale pin degrades instead of breaking.
# MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# The Firebase project whose ID tokens unlock the members-only model. NOT a secret — a project id
# is public by nature (it ships in the web app's config); it is the SIGNATURE on the token that
# proves anything, and that is checked against Google's published keys.
#
# Leave it unset and no token can ever be verified, so every request is served by the free Workers
# AI tier. That is the safe direction to fail, and it is the correct setting for a fork that has
# no Firebase project.
#
# SETTING THIS ARMS THE MEMBERS-ONLY GATE on the next `wrangler deploy`: signed-in users are
# served by FitForge's Mistral key, everyone else by the free Workers AI tier, so anonymous
# traffic exhausting the free tier cannot degrade signed-in users.
FIREBASE_PROJECT_ID = "fitforge-007"

# MISTRAL_API_KEY is a SECRET and must never be written here — this file is committed.
#   npx wrangler secret put MISTRAL_API_KEY
# or Dashboard → the worker → Settings → Variables and Secrets → Add → type "Secret".
# When it is set, Mistral becomes the primary backend and Workers AI becomes the fallback.
# Optional, and safe to commit since it is not a credential:
# MISTRAL_MODEL = "mistral-small-latest"

# ── Pro tier (DeepSeek) ─────────────────────────────────────────────────────────────────────
# The Mistral/Workers-AI config above is UNTOUCHED by this tier: guests keep Workers AI,
# signed-in users keep Mistral, and Pro users additionally unlock a DeepSeek-served entry in
# the model picker (which falls back to the normal chain if DeepSeek has an incident).
#
# DEEPSEEK_API_KEY — the worker reads it from either a var here or a secret; THIS REPO IS
# PUBLIC, so a literal key on the next line would be a published key within minutes of a push.
# Put it in as a secret instead, which lands on `env` identically:
#   npx wrangler secret put DEEPSEEK_API_KEY
# (On a private fork a plain var also works: DEEPSEEK_API_KEY = "sk-...".)
#
# PRO_USERS — comma-separated Firebase uids with a Pro subscription. This allowlist IS the
# subscription record until a billing system exists. Find a uid in Firebase console → Auth.
# PRO_USERS = "uid1, uid2"
#
# DEEPSEEK_MODEL — optional override; safe to commit. Current IDs (the old deepseek-chat /
# deepseek-reasoner aliases were RETIRED on 2026-07-24 and now return errors):
# DEEPSEEK_MODEL = "deepseek-v4-flash"   # default: fast + cheap, 1M context
# DEEPSEEK_MODEL = "deepseek-v4-pro"     # stronger, ~3x the price
